<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <pattern id="ctrl-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="900" height="280" fill="#0B0D0F"/>
  <rect width="900" height="280" fill="url(#ctrl-grid)"/>
  <rect x="0.5" y="0.5" width="899" height="279" fill="none" stroke="#2A2D31" stroke-width="1"/>

  <!-- Section Header -->
  <g transform="translate(28, 24)">
    <text x="0" y="0" fill="#B62B32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5">05 / CONTROL SURFACE &amp; KEYBOARD ERGONOMICS</text>
    <text x="0" y="15" fill="#E9E5DC" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Zero-Friction Recording Workflow &amp; Headroom Calibration</text>
  </g>

  <!-- Left: Keyboard Hotkeys HUD -->
  <g transform="translate(28, 62)">
    <rect width="414" height="190" rx="6" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
    <path d="M 0 0 L 414 0" stroke="#38BDF8" stroke-width="2"/>
    <text x="16" y="22" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">STUDIO KEYBOARD SHORTCUTS</text>

    <!-- Key Rows -->
    <g transform="translate(16, 36)">
      <!-- Spacebar -->
      <rect width="70" height="22" rx="4" fill="#181B20" stroke="#2A2D31" stroke-width="1"/>
      <text x="16" y="15" fill="#E9E5DC" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Space</text>
      <text x="82" y="15" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="10">Record / Stop Take (Hands-free recording)</text>

      <!-- Enter -->
      <g transform="translate(0, 28)">
        <rect width="70" height="22" rx="4" fill="#181B20" stroke="#10B981" stroke-width="1"/>
        <text x="18" y="15" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Enter</text>
        <text x="82" y="15" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="10">Accept take &amp; advance to next exercise</text>
      </g>

      <!-- R -->
      <g transform="translate(0, 56)">
        <rect width="70" height="22" rx="4" fill="#181B20" stroke="#F43F5E" stroke-width="1"/>
        <text x="30" y="15" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">R</text>
        <text x="82" y="15" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="10">Discard take &amp; immediately redo</text>
      </g>

      <!-- T & M -->
      <g transform="translate(0, 84)">
        <rect width="32" height="22" rx="4" fill="#181B20" stroke="#2A2D31" stroke-width="1"/>
        <text x="12" y="15" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">T</text>
        <rect x="38" width="32" height="22" rx="4" fill="#181B20" stroke="#2A2D31" stroke-width="1"/>
        <text x="48" y="15" fill="#8E8A82" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">M</text>
        <text x="82" y="15" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="10">Play reference tone (T) · Mute audio guide (M)</text>
      </g>

      <!-- Arrows -->
      <g transform="translate(0, 112)">
        <rect width="70" height="22" rx="4" fill="#181B20" stroke="#2A2D31" stroke-width="1"/>
        <text x="22" y="15" fill="#E9E5DC" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">←  →</text>
        <text x="82" y="15" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="10">Navigate previous / next exercise in bank</text>
      </g>
    </g>
  </g>

  <!-- Right: Input Gain & Headroom Calibration -->
  <g transform="translate(458, 62)">
    <rect width="414" height="190" rx="6" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
    <path d="M 0 0 L 414 0" stroke="#10B981" stroke-width="2"/>
    <text x="16" y="22" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">INPUT GAIN &amp; HEADROOM CALIBRATION</text>

    <!-- Calibration HUD -->
    <g transform="translate(16, 36)">
      <rect width="382" height="60" rx="4" fill="#0B0D0F" stroke="#2A2D31" stroke-width="0.8"/>
      
      <!-- VU Scale -->
      <text x="12" y="18" fill="#8E8A82" font-family="'JetBrains Mono', monospace" font-size="8">-∞ dBFS</text>
      <text x="120" y="18" fill="#8E8A82" font-family="'JetBrains Mono', monospace" font-size="8">-24 dBFS (Noise)</text>
      <text x="250" y="18" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8">-12 to -6 (Target)</text>
      <text x="340" y="18" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="8">0 dB (Clip)</text>

      <!-- Colored Meter Track -->
      <rect x="12" y="24" width="358" height="12" rx="3" fill="#181B20"/>
      <rect x="12" y="24" width="280" height="12" rx="3" fill="#10B981" fill-opacity="0.8"/>
      <rect x="292" y="24" width="50" height="12" fill="#FBBF24" fill-opacity="0.8"/>
      <rect x="342" y="24" width="28" height="12" fill="#F43F5E" fill-opacity="0.8"/>

      <text x="12" y="50" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8.5">✓ OPTIMAL HEADROOM · PEAK: -8.4 dBFS · NOISE: -64 dBFS</text>

      <g transform="translate(0, 72)">
        <text x="0" y="12" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="9.5">• 5-second automatic pre-flight test</text>
        <text x="0" y="28" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="9.5">• AudioWorklet disables browser AGC, AEC and NS</text>
        <text x="0" y="44" fill="#8E8A82" font-family="'Inter', sans-serif" font-size="9.5">• Warns against noisy rooms (&gt; -24 dBFS) before takes</text>
        <text x="0" y="60" fill="#10B981" font-family="'Inter', sans-serif" font-size="9.5">• Prevents digital clipping from entering AI dataset</text>
      </g>
    </g>
  </g>
</svg>
