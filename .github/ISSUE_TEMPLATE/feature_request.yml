name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: rules
    attributes:
      label: Project principles
      options:
        - label: It keeps all audio in the browser (no server, no uploads).
          required: true
        - label: It doesn't make it easier to clone someone's voice without consent.
          required: true
